name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          rm -rf Payload Igor-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Igor-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Igor-unsigned-ipa
          path: ios/Igor-unsigned.ipa
          if-no-files-found: error
