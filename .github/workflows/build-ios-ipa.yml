name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build unsigned app
        working-directory: ios
        run: |
          set -euxo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          SCHEME="Igor"
          rm -rf "$RUNNER_TEMP/IgorDerivedData" "$RUNNER_TEMP/IgorProducts"
          mkdir -p "$RUNNER_TEMP/IgorProducts"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/IgorDerivedData" CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/IgorProducts" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          echo "Build products:"
          find "$RUNNER_TEMP/IgorProducts" -maxdepth 2 -print

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/IgorProducts" -maxdepth 1 -type d -name "*.app" -print -quit)
          echo "Found app: $APP"
          test -n "$APP"
          rm -rf Payload Igor-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Igor-unsigned.ipa Payload
          test -s Igor-unsigned.ipa
          unzip -l Igor-unsigned.ipa | head -40
          ls -lh Igor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Igor-unsigned-ipa
          path: Igor-unsigned.ipa
          if-no-files-found: error
